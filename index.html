<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Under Upgrade</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
      flex-direction: column;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      animation: fadeInDown 1s ease forwards;
    }
    p {
      font-size: 1.2em;
      color: #ccc;
      margin-bottom: 30px;
      animation: fadeInUp 1.2s ease forwards;
    }
    .system-update {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #ffc107;
      animation: blink 1.5s infinite alternate;
    }
    .dot:nth-child(2) {
      animation-delay: 0.3s;
    }
    .dot:nth-child(3) {
      animation-delay: 0.6s;
    }
    @keyframes blink {
      0% { opacity: 0.2; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes fadeInDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .countdown {
      font-size: 2.5em;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px 40px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      animation: fadeInUp 2s ease forwards;
    }
  </style>
</head>
<body>
  <h1>We Are Upgrading</h1>
  <p>Your favorite site is getting better! Hang tight while we finish the update.</p>
  <div class="system-update">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="countdown" id="countdown"></div>

  <script>
    // Countdown from 10 days
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 10);

    function updateCountdown() {
      const now = new Date();
      const timeDiff = targetDate - now;

      const days = Math.max(0, Math.floor(timeDiff / (1000 * 60 * 60 * 24)));
      const hours = Math.floor((timeDiff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((timeDiff / (1000 * 60)) % 60);
      const seconds = Math.floor((timeDiff / 1000) % 60);

      document.getElementById("countdown").textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
