<!DOCTYPE html>
<html>
<head>
    <title>Gallery - Arie Savvy</title>
    <link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>
    <section class="header">
        <nav>
            <section class="logo">Arie Savvy</section>

            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="music.html">Music</a></li>
            </ul>
        </nav>
    </section>

    <section class="gallery-section">
        <h1>Gallery</h1>
        <div class="gallery-grid" id="gallery-grid">
            <!-- Images from Firestore will appear here -->
        </div>
    </section>

    <section class="footer">
        <p>&copy; 2025 Arie Savvy. All rights reserved.</p>
    </section>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCiaF7ZSZxTCL_za67XmOzSqdL0WrCGLVk",
            authDomain: "ariesavvy.firebaseapp.com",
            projectId: "ariesavvy",
            storageBucket: "ariesavvy.firebasestorage.app",
            messagingSenderId: "982950111913",
            appId: "1:982950111913:web:a78bcd881b69ed5c8ad7b8",
            measurementId: "G-W5WBCK8NFC"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const galleryGrid = document.getElementById('gallery-grid');

        function loadGallery() {
            galleryGrid.innerHTML = "";
            db.collection("gallery").get().then(snapshot => {
                if (snapshot.empty) {
                    const msg = document.createElement("p");
                    msg.textContent = "No images found in the gallery.";
                    msg.style.color = "#ffffff";
                    galleryGrid.appendChild(msg);
                } else {
                    snapshot.forEach((doc, index) => {
                        const data = doc.data();
                        if (data.imageUrl) {
                            // Wrap each image in a link to open in lightbox
                            const link = document.createElement("a");
                            link.href = `#lightbox-${index}`;
                            const img = document.createElement("img");
                            img.src = data.imageUrl;
                            img.classList.add("gallery-img");
                            link.appendChild(img);
                            galleryGrid.appendChild(link);

                            // Create lightbox overlay
                            const lightbox = document.createElement("div");
                            lightbox.id = `lightbox-${index}`;
                            lightbox.classList.add("lightbox");
                            lightbox.innerHTML = `<a href="#"><img src="${data.imageUrl}" /></a>`;
                            document.body.appendChild(lightbox);
                        }
                    });
                }
            }).catch(error => {
                console.error("Error fetching gallery:", error);
                const msg = document.createElement("p");
                msg.textContent = "❌ Failed to load gallery. Check Firebase rules.";
                msg.style.color = "red";
                galleryGrid.appendChild(msg);
            });
        }

        loadGallery();

        // Mobile menu toggle
        const mobileMenu = document.getElementById('mobile-menu');
        const navList = document.querySelector('.nav-list');
        mobileMenu.addEventListener('click', () => {
            navList.classList.toggle('active');
        });
    </script>
</body>
</html>
