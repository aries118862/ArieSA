
<!DOCTYPE html>
<html>
<head>
    <title>Music - Arie Savvy</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <section class="header">
        <nav>
            <section class="logo">Arie Savvy</section>

            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="music.html">Music</a></li>
            </ul>
        </nav>
    </section>

    <section class="music-section">
        <h1>Music</h1>
        <div class="music-grid" id="music-grid">
            <!-- YouTube embeds will appear here -->
        </div>
    </section>

    <section class="footer">
        <p>&copy; 2025 Arie Savvy. All rights reserved.</p>
    </section>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCiaF7ZSZxTCL_za67XmOzSqdL0WrCGLVk",
            authDomain: "ariesavvy.firebaseapp.com",
            projectId: "ariesavvy",
            storageBucket: "ariesavvy.firebasestorage.app",
            messagingSenderId: "982950111913",
            appId: "1:982950111913:web:a78bcd881b69ed5c8ad7b8",
            measurementId: "G-W5WBCK8NFC"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const musicGrid = document.getElementById('music-grid');

        // Load music from Firestore
        function loadMusic() {
            musicGrid.innerHTML = "";
            db.collection("music").get().then(snapshot => {
                if (snapshot.empty) {
                    const msg = document.createElement("p");
                    msg.textContent = "No music tracks found.";
                    msg.style.color = "#ffffff";
                    musicGrid.appendChild(msg);
                } else {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        if (data.youtubeLink) {
                            // Extract video ID from YouTube link
                            let videoId = data.youtubeLink.split("v=")[1];
                            if (videoId) {
                                const ampersandPosition = videoId.indexOf("&");
                                if (ampersandPosition !== -1) {
                                    videoId = videoId.substring(0, ampersandPosition);
                                }
                            } else if (data.youtubeLink.includes("youtu.be")) {
                                // handle short links like https://youtu.be/VIDEOID
                                videoId = data.youtubeLink.split("youtu.be/")[1];
                            } else {
                                videoId = data.youtubeLink;
                            }

                            // Create iframe
                            const iframe = document.createElement("iframe");
                            iframe.src = `https://www.youtube.com/embed/${videoId}`;
                            iframe.width = "360";
                            iframe.height = "215";
                            iframe.frameBorder = "0";
                            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
                            iframe.allowFullscreen = true;
                            iframe.classList.add("music-embed");
                            musicGrid.appendChild(iframe);
                        }
                    });
                }
            }).catch(error => {
                console.error("Error fetching music:", error);
                const msg = document.createElement("p");
                msg.textContent = "❌ Failed to load music. Check Firebase rules.";
                msg.style.color = "red";
                musicGrid.appendChild(msg);
            });
        }

        loadMusic();

        // Mobile menu toggle
        const mobileMenu = document.getElementById('mobile-menu');
        const navList = document.querySelector('.nav-list');
        mobileMenu.addEventListener('click', () => {
            navList.classList.toggle('active');
        });
    </script>
</body>
</html>
